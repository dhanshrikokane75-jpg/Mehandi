<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Mehndi Arts | Professional Mehndi Designs</title>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Marcellus&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #fdfbf7;
            --bg-surface: #ffffff;
            --text-main: #2c1a11;
            --text-muted: #604d43;
            --primary: #8a3324;
            --primary-hover: #a04030;
            --accent: #d4af37;
            --shadow: rgba(138, 51, 36, 0.08);
            --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        [data-theme="dark"] {
            --bg-primary: #120c08;
            --bg-surface: #1c1410;
            --text-main: #f5ebe6;
            --text-muted: #c8b7b0;
            --primary: #e06d53;
            --primary-hover: #ff856b;
            --accent: #f3cd67;
            --shadow: rgba(0, 0, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            transition: var(--transition);
            overflow-x: hidden;
            line-height: 1.6;
        }

        h1, h2, h3, .brand-logo {
            font-family: 'Marcellus', serif;
        }

        /* Navigation Bar */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: var(--bg-surface);
            box-shadow: 0 2px 20px var(--shadow);
            transition: var(--transition);
        }

        .navbar {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--primary);
            text-decoration: none;
            letter-spacing: 1px;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        /* Theme Toggle Button */
        .theme-btn {
            background: none;
            border: 2px solid var(--primary);
            color: var(--primary);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: var(--transition);
        }

        .theme-btn:hover {
            background: var(--primary);
            color: var(--bg-surface);
            transform: rotate(30deg);
        }

        .cta-btn {
            background: var(--primary);
            color: white;
            padding: 0.6rem 1.5rem;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: var(--transition);
            border: 1px solid transparent;
        }

        .cta-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px var(--shadow);
        }

        /* Hero Section */
        .hero {
            min-height: 90vh;
            padding: 8rem 2rem 4rem 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            background: radial-gradient(circle at 90% 10%, rgba(212, 175, 55, 0.08), transparent 40%);
        }

        .hero-content {
            max-width: 800px;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1s forwards 0.2s;
        }

        .hero h1 {
            font-size: 3.5rem;
            color: var(--text-main);
            margin-bottom: 1.5rem;
            line-height: 1.2;
        }

        .hero h1 span {
            color: var(--primary);
            border-bottom: 2px dashed var(--accent);
        }

        .hero p {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
        }

        /* Portfolio Gallery Section */
        .portfolio {
            padding: 6rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 3rem;
            position: relative;
            color: var(--text-main);
        }

        .section-title::after {
            content: '♦';
            display: block;
            font-size: 1rem;
            color: var(--accent);
            margin-top: 0.5rem;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }

        .gallery-card {
            background: var(--bg-surface);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px var(--shadow);
            transition: var(--transition);
            opacity: 0;
            transform: translateY(40px);
        }

        .gallery-card.reveal {
            opacity: 1;
            transform: translateY(0);
        }

        .gallery-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 40px var(--shadow);
        }

        .img-container {
            width: 100%;
            height: 350px;
            background-color: #e5dcd5;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Abstract Pattern Mockups using CSS */
        .img-container::before {
            content: '';
            position: absolute;
            width: 150px;
            height: 150px;
            border: 4px double var(--primary);
            border-radius: 50%;
            opacity: 0.25;
            animation: rotatePattern 20s linear infinite;
        }

        .img-container i {
            font-size: 4rem;
            color: var(--primary);
            opacity: 0.4;
        }

        .card-info {
            padding: 1.5rem;
            text-align: center;
        }

        .card-info h3 {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .card-info p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* Floating WhatsApp Widget */
        .whatsapp-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
        }

        .whatsapp-btn {
            background-color: #25d366;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
        }

        .whatsapp-btn:hover {
            transform: scale(1.1);
            background-color: #20ba5a;
        }

        /* Notification ripple animation */
        .whatsapp-btn::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #25d366;
            left: 0;
            top: 0;
            animation: pulse 2s infinite;
            z-index: -1;
        }

        /* Keyframe Animations */
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes rotatePattern {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        /* Responsive Configuration */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.3rem; }
            .navbar { padding: 1rem; }
            .cta-btn { display: none; } /* Hide secondary button on mobile text clarity */
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <nav class="navbar">
            <a href="#" class="brand-logo">Aura Mehndi</a>
            <div class="nav-actions">
                <button class="theme-btn" id="themeToggle" aria-label="Toggle Theme">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <a href="https://wa.me!" class="cta-btn" target="_blank">Book Now</a>
            </div>
        </nav>
    </header>

    <!-- Main Hero Banner Section -->
    <section class="hero">
        <div class="hero-content">
            <h1>Exquisite & Custom <span>Mehndi Designs</span> For Every Celebration</h1>
            <p>Elevate your bridal and celebratory elegance with highly detailed, modern, and traditional henna artwork tailored unique to you.</p>
